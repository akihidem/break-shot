<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>BREAK SHOT</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:radial-gradient(ellipse at 50% 0%,#14224d 0%,#0a1230 55%,#060b20 100%) #070d24;
  color:#e8f0ff;
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic","Meiryo",system-ui,-apple-system,"Segoe UI",sans-serif;
  min-height:100vh;display:flex;justify-content:center;align-items:flex-start;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
#app{width:100%;max-width:480px;padding:8px 8px 10px;display:flex;flex-direction:column;gap:6px;align-items:stretch}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:5px;min-width:0}
h1{margin:0;font-size:17px;font-style:italic;font-weight:900;letter-spacing:.5px;white-space:nowrap;
  font-family:"Arial Black","Helvetica Neue",Arial,sans-serif;
  background:linear-gradient(90deg,#00e5ff,#ff3d8f);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 6px rgba(0,229,255,.35))}
.cpusel{display:flex;align-items:center;gap:4px;font-size:10px;font-weight:700;color:#9fb3d9;letter-spacing:.5px}
.cpusel select{background:#111c42;color:#e8f0ff;border:1px solid #3a4c88;border-radius:8px;padding:3px 4px;font-size:11px;font-weight:700;outline:none;font-family:inherit}
.pill{border-radius:999px;padding:4px 8px;font-size:10.5px;font-weight:800;letter-spacing:.5px;white-space:nowrap;border:1px solid;transition:all .2s}
.pill.p{color:#8ff3ff;border-color:#00c8e6;background:rgba(0,200,230,.14);box-shadow:0 0 10px rgba(0,229,255,.3)}
.pill.c{color:#ffa6cb;border-color:#ff3d8f;background:rgba(255,61,143,.14);box-shadow:0 0 10px rgba(255,61,143,.3)}
.iconbtn{width:32px;height:32px;border-radius:50%;border:1px solid #3a4c88;background:#111c42;color:#e8f0ff;font-size:14px;cursor:pointer;padding:0;line-height:1;flex:none}
.iconbtn:active{transform:scale(.92)}
.score{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:stretch}
.panel{border-radius:12px;padding:5px 9px;border:1px solid;display:flex;flex-direction:column;gap:2px;transition:box-shadow .2s,opacity .2s;opacity:.78}
.panel.active{opacity:1}
.panel.p{background:linear-gradient(180deg,rgba(0,140,255,.22),rgba(0,140,255,.07));border-color:#1aa3ff}
.panel.c{background:linear-gradient(180deg,rgba(255,61,143,.22),rgba(255,61,143,.07));border-color:#ff3d8f}
.panel.p.active{box-shadow:0 0 14px rgba(0,190,255,.5)}
.panel.c.active{box-shadow:0 0 14px rgba(255,61,143,.5)}
.pname{font-size:12px;font-weight:900;letter-spacing:1px}
.panel.p .pname{color:#6fd6ff}.panel.c .pname{color:#ff8fbf}
.row{display:flex;align-items:center;justify-content:space-between;font-size:11px;font-weight:700;gap:6px}
.dots{display:inline-flex;gap:3px}
.dot{width:8px;height:8px;border-radius:50%;border:1px solid;opacity:.9}
.panel.p .dot{border-color:#42b8ff}.panel.c .dot{border-color:#ff5fa3}
.panel.p .dot.on{background:#27b0ff;box-shadow:0 0 5px #27b0ff}
.panel.c .dot.on{background:#ff4f96;box-shadow:0 0 5px #ff4f96}
.timer{min-width:84px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid #33457f;padding:5px 10px 7px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.tnum{font-size:23px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1;font-family:"Arial Black",Arial,sans-serif}
.tnum small{font-size:10px;font-weight:700;color:#9fb3d9;margin-left:2px}
.tnum.low{color:#ff6b6b}
.tbar{width:100%;height:4px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
.tbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#00e5ff,#7cf);border-radius:3px}
.tbar i.low{background:#ff6b6b}
.roundline{text-align:center;font-size:11px;color:#9fb3d9;font-weight:600;letter-spacing:.2px;line-height:1.3}
.roundline b{color:#e8f0ff}
.boardwrap{position:relative;margin:0 auto;width:340px}
canvas{display:block;width:100%;height:auto;touch-action:none;-ms-touch-action:none}
.hint{text-align:center;font-size:12px;font-weight:700;color:#b9c8ea;background:rgba(255,255,255,.06);border:1px solid #26366e;border-radius:10px;padding:7px 8px}
.hint span{color:#00e5ff;margin:0 6px}
.ov{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:5;border-radius:22px;text-align:center}
.ov.show{display:flex}
.ov.dim{background:rgba(4,8,26,.78);backdrop-filter:blur(2px)}
.ov h2{margin:0;font-size:34px;font-style:italic;font-weight:900;font-family:"Arial Black",Arial,sans-serif;letter-spacing:1px;text-shadow:0 0 18px currentColor}
.ov p{margin:0;font-size:14px;font-weight:700;color:#cfdcff}
.ov.win h2{color:#4df0ff}.ov.lose h2{color:#ff6fa8}
#banner{pointer-events:none;background:rgba(4,8,26,.45)}
#banner.show h2{animation:pop .45s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.btn{border:1px solid #00c8e6;background:linear-gradient(180deg,#0e86a8,#0a5b86);color:#fff;font-weight:800;font-size:15px;border-radius:999px;padding:10px 28px;cursor:pointer;font-family:inherit;min-width:170px;box-shadow:0 0 14px rgba(0,229,255,.35)}
.btn.alt{border-color:#ff3d8f;background:linear-gradient(180deg,#a3306a,#6e1f4a);box-shadow:0 0 14px rgba(255,61,143,.3)}
.btn:active{transform:scale(.96)}
@media (max-width:400px){h1{font-size:15px}.pill{padding:4px 6px;font-size:10px}.cpusel select{font-size:10px;padding:2px}.iconbtn{width:28px;height:28px}.cpusel{font-size:9px}.timer{min-width:72px}.tnum{font-size:20px}}
</style>
</head>
<body>
<div id="app">
  <div class="hdr" id="hdr">
    <h1>BREAK SHOT</h1>
    <label class="cpusel">CPU
      <select id="diff">
        <option value="easy">Easy</option>
        <option value="normal" selected>Normal</option>
        <option value="hard">Hard</option>
      </select>
    </label>
    <div class="pill p" id="turnPill">TURN : PLAYER</div>
    <button class="iconbtn" id="pauseBtn" aria-label="pause">⏸</button>
  </div>

  <div class="score" id="score">
    <div class="panel p" id="panP">
      <div class="pname">PLAYER</div>
      <div class="row"><span id="opP">OP ×3</span><span class="dots" id="opDotsP"></span></div>
      <div class="row"><span id="defP">DEF ×3</span><span class="dots" id="defDotsP"></span></div>
    </div>
    <div class="timer">
      <div class="tnum" id="tnum">10.0<small>s</small></div>
      <div class="tbar"><i id="tbar"></i></div>
    </div>
    <div class="panel c" id="panC">
      <div class="pname">CPU</div>
      <div class="row"><span id="opC">OP ×3</span><span class="dots" id="opDotsC"></span></div>
      <div class="row"><span id="defC">DEF ×3</span><span class="dots" id="defDotsC"></span></div>
    </div>
  </div>

  <div class="roundline" id="roundLine"></div>

  <div class="boardwrap" id="wrap">
    <canvas id="cv"></canvas>
    <div class="ov" id="banner"><h2 id="bannerTitle"></h2><p id="bannerSub"></p></div>
    <div class="ov dim" id="pauseOv">
      <h2 style="color:#e8f0ff">PAUSE</h2>
      <button class="btn" id="resumeBtn">再開</button>
      <button class="btn alt" id="restartBtn1">リスタート</button>
    </div>
    <div class="ov dim" id="matchOv">
      <h2 id="matchTitle">MATCH WIN!</h2>
      <p id="matchSub"></p>
      <button class="btn" id="restartBtn2">もう一度あそぶ</button>
    </div>
  </div>

  <div class="hint" id="hint">円盤を引っ張ってショット！<span>|</span>矢印の方向に発射</div>
</div>

<script>
(() => {
'use strict';

/* ================= Constants ================= */
const W = 360, H = 560;          // board size (logical px)
const PAD = 12;                  // canvas padding around board for glow
const CW = W + PAD * 2, CH = H + PAD * 2;
const M = 12;                    // frame thickness (wall position)
const POCKETS = [{x:23,y:23},{x:W-23,y:23},{x:23,y:H-23},{x:W-23,y:H-23}];
const POCKET_R = 22, CAPTURE = 24;
const R_S = 11, R_K = 16;        // small disc radius / striker radius
const M_S = 1, M_K = 2.2;        // masses
const FRICTION = 1.6, CONST_DECEL = 25, STOP = 10;
const E_WALL = 0.85, E_DISC = 0.94;
const VMIN = 140, VMAX = 1300, MAXDRAG = 110;
const AIM_TIME = 10;
const WIN_ROUNDS = 3;

const HOME = {
  P: { k:{x:180,y:482}, s:[{x:180,y:412},{x:136,y:372},{x:224,y:372}] },
  C: { k:{x:180,y:H-482}, s:[{x:180,y:H-412},{x:136,y:H-372},{x:224,y:H-372}] }
};
const COL = {
  P: { main:'#2f9bff', light:'#bfe6ff', rim:'#0a3a80', glow:'#00e5ff' },
  C: { main:'#ff4f96', light:'#ffd0e4', rim:'#7e0c3e', glow:'#ff3d8f' }
};
const DIFF = {
  easy:   { err:0.13,  pm:0.80, pmin:0.25, pmax:0.65, perr:0.20, direct:0.35 },
  normal: { err:0.05,  pm:1.00, pmin:0.35, pmax:0.90, perr:0.10, direct:0.15 },
  hard:   { err:0.015, pm:1.15, pmin:0.55, pmax:1.00, perr:0.04, direct:0.05 }
};

/* ================= DOM ================= */
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
const wrap = $('wrap'), app = $('app');
const diffSel = $('diff');

/* ================= State ================= */
let discs = [];
let sideSt = { P:{op:3,def:3}, C:{op:3,def:3} };
let score = { P:0, C:0 };
let round = 1;
let turn = 'P';
let state = 'aim';               // aim | moving | roundEnd | matchEnd
let paused = false;
let timer = AIM_TIME;
let drag = null;                 // {id,x,y}
let aimShow = null;              // {side,ux,uy,power} (CPU aim display)
let cpu = { t:0, phase:0, plan:null };
let shot = null;                 // {side,hit}
let movingT = 0;
let roundEndT = 0, bannerShown = false, roundWinner = null;
let difficulty = 'normal';
let clock = 0;
let vs = 1;                      // device px per logical px
let cache = null;

/* ================= Audio ================= */
let actx = null;
const lastSfx = { disc:0, wall:0, pocket:0 };
function initAudio(){
  try{
    if(!actx){ const AC = window.AudioContext || window.webkitAudioContext; if(AC) actx = new AC(); }
    if(actx && actx.state === 'suspended') actx.resume();
  }catch(e){ actx = null; }
}
function blip(f, d, type, v, f2){
  if(!actx) return;
  try{
    const t = actx.currentTime;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f, t);
    if(f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(v, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t + d + 0.03);
  }catch(e){}
}
function sfx(kind, strength){
  if(!actx) return;
  const t = actx.currentTime;
  if(t - lastSfx[kind] < (kind === 'pocket' ? 0.1 : 0.035)) return;
  lastSfx[kind] = t;
  const s = Math.min(1, strength);
  if(kind === 'disc') blip(380 + s * 260, 0.07, 'triangle', 0.05 + s * 0.17, 180);
  else if(kind === 'wall') blip(160 + s * 70, 0.06, 'sine', 0.04 + s * 0.14, 90);
  else if(kind === 'pocket'){ blip(620, 0.28, 'sine', 0.2, 140); blip(310, 0.3, 'triangle', 0.1, 70); }
}
['pointerdown','touchstart','keydown','mousedown'].forEach(ev => window.addEventListener(ev, initAudio, {passive:true}));

/* ================= Helpers ================= */
const rand = (a,b) => a + Math.random() * (b - a);
const gauss = () => (Math.random() + Math.random() + Math.random() - 1.5) / 1.5;
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const other = s => s === 'P' ? 'C' : 'P';
const striker = side => discs.find(d => d.side === side && d.kind === 'k');
function rr(c,x,y,w,h,r){
  c.beginPath();
  c.moveTo(x+r,y); c.lineTo(x+w-r,y); c.arcTo(x+w,y,x+w,y+r,r);
  c.lineTo(x+w,y+h-r); c.arcTo(x+w,y+h,x+w-r,y+h,r);
  c.lineTo(x+r,y+h); c.arcTo(x,y+h,x,y+h-r,r);
  c.lineTo(x,y+r); c.arcTo(x,y,x+r,y,r); c.closePath();
}

/* ================= Setup ================= */
function makeDisc(side, kind, pos){
  return {
    side, kind, x:pos.x, y:pos.y, vx:0, vy:0,
    r: kind === 'k' ? R_K : R_S, m: kind === 'k' ? M_K : M_S,
    state:'alive', t:0, sp:1, sx:0, sy:0, px:0, py:0
  };
}
function makeDiscs(){
  const arr = [];
  for(const side of ['P','C']){
    arr.push(makeDisc(side,'k',HOME[side].k));
    HOME[side].s.forEach(p => arr.push(makeDisc(side,'s',p)));
  }
  return arr;
}
function setupRound(){
  discs = makeDiscs();
  sideSt = { P:{op:3,def:3}, C:{op:3,def:3} };
  shot = null; drag = null; aimShow = null;
  roundWinner = null; bannerShown = false;
  $('banner').classList.remove('show');
  $('matchOv').classList.remove('show');
  startAim(round % 2 === 1 ? 'P' : 'C');
}
function restartMatch(){
  score = { P:0, C:0 };
  round = 1;
  paused = false;
  $('pauseOv').classList.remove('show');
  setupRound();
}
function startAim(side){
  turn = side;
  state = 'aim';
  timer = AIM_TIME;
  drag = null; aimShow = null;
  cpu = { t:0, phase:0, plan:null };
  updateHUD();
}

/* ================= HUD ================= */
function dotsHTML(n){
  let s = '';
  for(let i = 0; i < 3; i++) s += '<i class="dot' + (i < n ? ' on' : '') + '"></i>';
  return s;
}
let hudCache = '';
function updateHUD(){
  const key = [sideSt.P.op,sideSt.P.def,sideSt.C.op,sideSt.C.def,turn,state,score.P,score.C,round].join('|');
  if(key === hudCache) return;
  hudCache = key;
  for(const s of ['P','C']){
    $('op'+s).textContent = 'OP ×' + sideSt[s].op;
    $('def'+s).textContent = 'DEF ×' + sideSt[s].def;
    $('opDots'+s).innerHTML = dotsHTML(sideSt[s].op);
    $('defDots'+s).innerHTML = dotsHTML(sideSt[s].def);
  }
  const pill = $('turnPill');
  pill.textContent = 'TURN : ' + (turn === 'P' ? 'PLAYER' : 'CPU');
  pill.className = 'pill ' + (turn === 'P' ? 'p' : 'c');
  $('panP').classList.toggle('active', turn === 'P');
  $('panC').classList.toggle('active', turn === 'C');
  $('roundLine').innerHTML = 'ROUND ' + round + ' ・ あなた <b>' + score.P + '</b> — <b>' + score.C + '</b> CPU ・ 先に' + WIN_ROUNDS + 'ラウンド取った方の勝ち';
}
let lastTimerTxt = '';
function updateTimerUI(){
  const t = state === 'aim' ? Math.max(0, timer) : (state === 'moving' ? Math.max(0, timer) : 0);
  const txt = t.toFixed(1);
  if(txt === lastTimerTxt) return;
  lastTimerTxt = txt;
  const n = $('tnum');
  n.innerHTML = txt + '<small>s</small>';
  n.classList.toggle('low', t <= 3 && state === 'aim');
  const b = $('tbar');
  b.style.width = (t / AIM_TIME * 100) + '%';
  b.classList.toggle('low', t <= 3 && state === 'aim');
}

/* ================= Gameplay ================= */
function shoot(side, ux, uy, power){
  const st = striker(side);
  if(!st || st.state !== 'alive'){ passTurn(); return; }
  const sp = VMIN + power * (VMAX - VMIN);
  st.vx = ux * sp; st.vy = uy * sp;
  shot = { side, hit:false };
  state = 'moving'; movingT = 0;
  drag = null; aimShow = null;
  blip(220 + power * 200, 0.1, 'square', 0.06, 110);
  updateHUD();
}
function passTurn(){
  startAim(other(turn));
}
function allStopped(){
  for(const d of discs){
    if(d.state === 'sinking') return false;
    if(d.state === 'alive' && (d.vx !== 0 || d.vy !== 0)) return false;
  }
  return true;
}
function isFree(x, y, r, self){
  if(x < M + r || x > W - M - r || y < M + r || y > H - M - r) return false;
  for(const o of discs){
    if(o === self || o.state === 'out' || o.state === 'sinking') continue;
    if(Math.hypot(o.x - x, o.y - y) < o.r + r + 2) return false;
  }
  for(const p of POCKETS) if(Math.hypot(p.x - x, p.y - y) < CAPTURE + 4) return false;
  return true;
}
function respawn(d){
  const home = HOME[d.side].k;
  let pos = null;
  if(isFree(home.x, home.y, d.r, d)) pos = home;
  else{
    outer:
    for(let rad = 8; rad < 220; rad += 8){
      for(let a = 0; a < 16; a++){
        const ang = a / 16 * Math.PI * 2;
        const x = home.x + Math.cos(ang) * rad, y = home.y + Math.sin(ang) * rad;
        if(isFree(x, y, d.r, d)){ pos = {x, y}; break outer; }
      }
    }
  }
  if(!pos) pos = home;
  d.x = pos.x; d.y = pos.y; d.vx = d.vy = 0;
  d.state = 'alive'; d.sp = 0;
}
function finishShot(){
  for(const side of ['P','C']){
    const st = striker(side);
    if(st.state === 'out' && sideSt[side].def > 0) respawn(st);
  }
  const again = shot && shot.hit;
  const side = shot ? shot.side : turn;
  shot = null;
  startAim(again ? side : other(side));
}
function onPocket(d, p){
  d.state = 'sinking'; d.t = 0;
  d.sx = d.x; d.sy = d.y; d.px = p.x; d.py = p.y;
  d.vx = d.vy = 0;
  sfx('pocket', 1);
  if(d.kind === 'k') sideSt[d.side].def = Math.max(0, sideSt[d.side].def - 1);
  else sideSt[d.side].op = Math.max(0, sideSt[d.side].op - 1);
  if(shot && d.side !== shot.side) shot.hit = true;
  updateHUD();
  if(state === 'moving' || state === 'aim'){
    if(sideSt[d.side].op === 0 || sideSt[d.side].def === 0) endRound(d.side);
  }
}
function endRound(loser){
  roundWinner = other(loser);
  score[roundWinner]++;
  state = 'roundEnd';
  roundEndT = 0; bannerShown = false;
  drag = null; aimShow = null;
  hudCache = ''; updateHUD();
}
function showRoundEndUI(){
  bannerShown = true;
  const youWon = roundWinner === 'P';
  if(score[roundWinner] >= WIN_ROUNDS){
    state = 'matchEnd';
    const mo = $('matchOv');
    mo.classList.remove('win','lose');
    mo.classList.add(youWon ? 'win' : 'lose');
    $('matchTitle').textContent = youWon ? 'MATCH WIN!' : 'MATCH LOSE…';
    $('matchSub').textContent = 'あなた ' + score.P + ' — ' + score.C + ' CPU';
    mo.classList.add('show');
  }else{
    const b = $('banner');
    b.classList.remove('win','lose','show');
    void b.offsetWidth;
    b.classList.add(youWon ? 'win' : 'lose', 'show');
    $('bannerTitle').textContent = youWon ? 'ROUND WIN!' : 'ROUND LOSE…';
    $('bannerSub').textContent = 'あなた ' + score.P + ' — ' + score.C + ' CPU';
  }
}

/* ================= Physics ================= */
function physics(dt){
  const n = Math.max(1, Math.ceil(dt / (1/240)));
  const h = dt / n;
  for(let i = 0; i < n; i++) step(h);
}
function step(h){
  const L = discs.length;
  for(let i = 0; i < L; i++){
    const d = discs[i];
    if(d.state !== 'alive') continue;
    if(d.vx === 0 && d.vy === 0) continue;
    d.x += d.vx * h; d.y += d.vy * h;
    let s = Math.hypot(d.vx, d.vy);
    let ns = s - (FRICTION * s + CONST_DECEL) * h;
    if(ns < STOP){ d.vx = d.vy = 0; }
    else { const k = ns / s; d.vx *= k; d.vy *= k; }
    // walls
    const minX = M + d.r, maxX = W - M - d.r, minY = M + d.r, maxY = H - M - d.r;
    if(d.x < minX){ d.x = minX; if(d.vx < 0){ sfx('wall', -d.vx / 800); d.vx = -d.vx * E_WALL; } }
    else if(d.x > maxX){ d.x = maxX; if(d.vx > 0){ sfx('wall', d.vx / 800); d.vx = -d.vx * E_WALL; } }
    if(d.y < minY){ d.y = minY; if(d.vy < 0){ sfx('wall', -d.vy / 800); d.vy = -d.vy * E_WALL; } }
    else if(d.y > maxY){ d.y = maxY; if(d.vy > 0){ sfx('wall', d.vy / 800); d.vy = -d.vy * E_WALL; } }
  }
  // disc-disc
  for(let i = 0; i < L; i++){
    const a = discs[i];
    if(a.state !== 'alive') continue;
    for(let j = i + 1; j < L; j++){
      const b = discs[j];
      if(b.state !== 'alive') continue;
      const dx = b.x - a.x, dy = b.y - a.y, rs = a.r + b.r;
      const d2 = dx * dx + dy * dy;
      if(d2 >= rs * rs) continue;
      let dist = Math.sqrt(d2);
      let nx, ny;
      if(dist < 1e-6){ nx = 1; ny = 0; dist = 0; } else { nx = dx / dist; ny = dy / dist; }
      const ima = 1 / a.m, imb = 1 / b.m;
      const pen = rs - dist;
      a.x -= nx * pen * ima / (ima + imb); a.y -= ny * pen * ima / (ima + imb);
      b.x += nx * pen * imb / (ima + imb); b.y += ny * pen * imb / (ima + imb);
      const rvx = b.vx - a.vx, rvy = b.vy - a.vy;
      const vn = rvx * nx + rvy * ny;
      if(vn < 0){
        const jimp = -(1 + E_DISC) * vn / (ima + imb);
        a.vx -= jimp * nx * ima; a.vy -= jimp * ny * ima;
        b.vx += jimp * nx * imb; b.vy += jimp * ny * imb;
        sfx('disc', -vn / 700);
      }
    }
  }
  // pockets
  for(let i = 0; i < L; i++){
    const d = discs[i];
    if(d.state !== 'alive') continue;
    for(const p of POCKETS){
      if(Math.hypot(p.x - d.x, p.y - d.y) < CAPTURE){ onPocket(d, p); break; }
    }
  }
}

/* ================= CPU AI ================= */
function segDist(px, py, x1, y1, x2, y2){
  const vx = x2 - x1, vy = y2 - y1;
  const l2 = vx * vx + vy * vy;
  let t = l2 > 0 ? ((px - x1) * vx + (py - y1) * vy) / l2 : 0;
  t = clamp(t, 0, 1);
  return Math.hypot(px - (x1 + vx * t), py - (y1 + vy * t));
}
function pathClear(x1, y1, x2, y2, r, excl){
  for(const o of discs){
    if(o.state !== 'alive' || excl.includes(o)) continue;
    if(segDist(o.x, o.y, x1, y1, x2, y2) < r + o.r + 1) return false;
  }
  return true;
}
function cpuPlan(){
  const S = striker('C');
  const df = DIFF[difficulty];
  const targets = discs.filter(d => d.side === 'P' && d.state === 'alive');
  const cands = [];
  for(const T of targets){
    for(const P of POCKETS){
      let px = P.x - T.x, py = P.y - T.y;
      const d2 = Math.hypot(px, py);
      if(d2 < 1) continue;
      px /= d2; py /= d2;
      const gx = T.x - px * (S.r + T.r), gy = T.y - py * (S.r + T.r);
      if(gx < M + S.r || gx > W - M - S.r || gy < M + S.r || gy > H - M - S.r) continue;
      let ax = gx - S.x, ay = gy - S.y;
      const d1 = Math.hypot(ax, ay);
      if(d1 < 1) continue;
      ax /= d1; ay /= d1;
      const cut = ax * px + ay * py;
      if(cut < 0.35) continue;
      if(!pathClear(S.x, S.y, gx, gy, S.r, [S, T])) continue;
      if(!pathClear(T.x, T.y, P.x, P.y, T.r, [S, T])) continue;
      const vt = FRICTION * d2 + 90;
      const v0 = vt / (1.32 * cut) + FRICTION * d1 + 50;
      cands.push({ ax, ay, v0, sc: cut * 2 - (d1 + d2) / 900 + (T.kind === 'k' ? 0.15 : 0) });
    }
  }
  cands.sort((a, b) => b.sc - a.sc);
  let ax, ay, v0;
  if(cands.length && Math.random() >= df.direct){
    let pick = 0;
    if(difficulty === 'easy') pick = Math.floor(Math.random() * Math.min(3, cands.length));
    else if(difficulty === 'normal') pick = (Math.random() < 0.6) ? 0 : Math.min(1, cands.length - 1);
    const c = cands[pick];
    ax = c.ax; ay = c.ay; v0 = c.v0;
  }else{
    // direct line toward a target disc (or pocket line through it)
    let T;
    if(difficulty === 'hard'){
      T = targets.slice().sort((a, b) => Math.hypot(a.x - S.x, a.y - S.y) - Math.hypot(b.x - S.x, b.y - S.y))[0];
    }else T = targets[Math.floor(Math.random() * targets.length)];
    ax = T.x - S.x; ay = T.y - S.y;
    const d1 = Math.hypot(ax, ay) || 1;
    ax /= d1; ay /= d1;
    v0 = FRICTION * d1 + rand(350, 650);
  }
  v0 *= df.pm;
  let power = (v0 - VMIN) / (VMAX - VMIN);
  power = clamp(power, df.pmin, df.pmax);
  power = clamp(power * (1 + gauss() * df.perr), 0.12, df.pmax);
  const ang = Math.atan2(ay, ax) + gauss() * df.err;
  return { ux: Math.cos(ang), uy: Math.sin(ang), power };
}

/* ================= Update ================= */
function update(dt){
  if(paused) return;
  // animations
  for(const d of discs){
    if(d.state === 'sinking'){ d.t += dt / 0.4; if(d.t >= 1){ d.t = 1; d.state = 'out'; } }
    else if(d.state === 'alive' && d.sp < 1) d.sp = Math.min(1, d.sp + dt / 0.35);
  }
  if(state === 'aim'){
    timer -= dt;
    if(timer <= 0){ timer = 0; passTurn(); }
    else if(turn === 'C'){
      cpu.t += dt;
      const st = striker('C');
      if(!st || st.state !== 'alive'){ passTurn(); }
      else if(cpu.phase === 0 && cpu.t >= 1.0){
        cpu.plan = cpuPlan();
        aimShow = { side:'C', ux:cpu.plan.ux, uy:cpu.plan.uy, power:cpu.plan.power };
        cpu.phase = 1; cpu.t = 0;
      }else if(cpu.phase === 1 && cpu.t >= 0.8){
        shoot('C', cpu.plan.ux, cpu.plan.uy, cpu.plan.power);
      }
    }
  }else if(state === 'moving'){
    physics(dt);
    movingT += dt;
    if(state === 'moving'){
      if(movingT > 20){ for(const d of discs){ d.vx = d.vy = 0; } }
      if(allStopped()) finishShot();
    }
  }else if(state === 'roundEnd' || state === 'matchEnd'){
    physics(dt);
    roundEndT += dt;
    if(state === 'roundEnd'){
      if(!bannerShown && roundEndT > 0.9) showRoundEndUI();
      if(state === 'roundEnd' && roundEndT > 3.4){ round++; setupRound(); }
    }
  }
}

/* ================= Input ================= */
function toLogical(e){
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * CW - PAD, y: (e.clientY - r.top) / r.height * CH - PAD };
}
cv.addEventListener('pointerdown', e => {
  initAudio();
  if(paused || state !== 'aim' || turn !== 'P' || drag) return;
  const st = striker('P');
  if(!st || st.state !== 'alive') return;
  const p = toLogical(e);
  if(Math.hypot(p.x - st.x, p.y - st.y) <= st.r + 16){
    drag = { id:e.pointerId, x:p.x, y:p.y };
    try{ cv.setPointerCapture(e.pointerId); }catch(err){}
    e.preventDefault();
  }
});
cv.addEventListener('pointermove', e => {
  if(!drag || drag.id !== e.pointerId) return;
  const p = toLogical(e);
  drag.x = p.x; drag.y = p.y;
  e.preventDefault();
});
function dragInfo(){
  const st = striker('P');
  const dx = drag.x - st.x, dy = drag.y - st.y;
  const len = Math.hypot(dx, dy);
  const power = len < 6 ? 0 : Math.min(len, MAXDRAG) / MAXDRAG;
  return { dx, dy, len, power, ux: len > 0 ? -dx / len : 0, uy: len > 0 ? -dy / len : -1 };
}
function endDrag(e, cancel){
  if(!drag || drag.id !== e.pointerId) return;
  const info = dragInfo();
  try{ cv.releasePointerCapture(e.pointerId); }catch(err){}
  drag = null;
  if(cancel || paused || state !== 'aim' || turn !== 'P') return;
  if(info.power < 0.08) return;     // cancelled by near-zero power
  shoot('P', info.ux, info.uy, info.power);
}
cv.addEventListener('pointerup', e => endDrag(e, false));
cv.addEventListener('pointercancel', e => endDrag(e, true));
cv.addEventListener('contextmenu', e => e.preventDefault());

function setPaused(v){
  if(state === 'matchEnd') return;
  paused = v;
  if(v) drag = null;
  $('pauseOv').classList.toggle('show', v);
}
$('pauseBtn').addEventListener('click', () => { initAudio(); setPaused(!paused); });
$('resumeBtn').addEventListener('click', () => setPaused(false));
$('restartBtn1').addEventListener('click', restartMatch);
$('restartBtn2').addEventListener('click', restartMatch);
window.addEventListener('keydown', e => {
  if(e.key === 'Escape' || e.key === 'p' || e.key === 'P') setPaused(!paused);
});
diffSel.addEventListener('change', () => { difficulty = diffSel.value; diffSel.blur(); });
document.addEventListener('visibilitychange', () => { if(document.hidden && state !== 'matchEnd') setPaused(true); });

/* ================= Rendering ================= */
function buildCache(){
  cache = document.createElement('canvas');
  cache.width = cv.width; cache.height = cv.height;
  const c = cache.getContext('2d');
  const s = vs;
  c.setTransform(s, 0, 0, s, PAD * s, PAD * s);

  // frame body
  rr(c, 0, 0, W, H, 20);
  const fg = c.createLinearGradient(0, 0, 0, H);
  fg.addColorStop(0, '#1a1030'); fg.addColorStop(.5, '#0b1330'); fg.addColorStop(1, '#08183a');
  c.fillStyle = fg; c.fill();

  // neon glow (pink top half, cyan bottom half)
  const halves = [['#ff3d8f', -PAD, H / 2 + PAD], ['#00e5ff', H / 2, H / 2 + PAD]];
  for(const [col, y0, hh] of halves){
    for(const pass of [0, 1]){
      c.save();
      c.beginPath(); c.rect(-PAD, y0, W + PAD * 2, hh); c.clip();
      rr(c, 1.5, 1.5, W - 3, H - 3, 19);
      c.lineWidth = pass ? 1.6 : 3.2;
      c.strokeStyle = col;
      c.shadowColor = col; c.shadowBlur = (pass ? 6 : 16) * s;
      c.stroke();
      c.restore();
    }
  }
  // inner thin neon line along surface edge
  c.save();
  rr(c, M - 2, M - 2, W - 2 * M + 4, H - 2 * M + 4, 12);
  c.lineWidth = 1; c.strokeStyle = 'rgba(120,200,255,.25)'; c.stroke();
  c.restore();

  // playing surface
  c.save();
  rr(c, M, M, W - 2 * M, H - 2 * M, 10);
  const sg = c.createLinearGradient(0, M, 0, H - M);
  sg.addColorStop(0, '#12808c'); sg.addColorStop(.5, '#0f7480'); sg.addColorStop(1, '#0d6a80');
  c.fillStyle = sg; c.fill();
  c.clip();
  const vg = c.createRadialGradient(W / 2, H / 2, 40, W / 2, H / 2, H * .62);
  vg.addColorStop(0, 'rgba(120,255,240,.14)'); vg.addColorStop(1, 'rgba(0,20,40,.38)');
  c.fillStyle = vg; c.fillRect(0, 0, W, H);

  // markings
  c.strokeStyle = 'rgba(210,255,250,.34)'; c.lineWidth = 1.6;
  c.beginPath(); c.moveTo(M, H / 2); c.lineTo(W - M, H / 2); c.stroke();
  c.beginPath(); c.arc(W / 2, H / 2, 52, 0, Math.PI * 2); c.stroke();
  c.fillStyle = 'rgba(210,255,250,.45)';
  c.beginPath(); c.arc(W / 2, H / 2, 3, 0, Math.PI * 2); c.fill();
  c.lineWidth = 1.2; c.strokeStyle = 'rgba(210,255,250,.28)';
  // tick marks on halfway line
  for(let x = M + 24; x < W - M; x += 24){
    if(Math.abs(x - W / 2) < 56) continue;
    c.beginPath(); c.moveTo(x, H / 2 - 4); c.lineTo(x, H / 2 + 4); c.stroke();
  }
  // tick marks along side walls
  for(let y = M + 40; y < H - M - 20; y += 40){
    c.beginPath(); c.moveTo(M, y); c.lineTo(M + 7, y); c.stroke();
    c.beginPath(); c.moveTo(W - M, y); c.lineTo(W - M - 7, y); c.stroke();
  }
  // home circles
  c.setLineDash([3, 5]);
  for(const side of ['P','C']){
    const k = HOME[side].k;
    c.strokeStyle = side === 'P' ? 'rgba(120,230,255,.4)' : 'rgba(255,150,200,.4)';
    c.beginPath(); c.arc(k.x, k.y, R_K + 8, 0, Math.PI * 2); c.stroke();
  }
  c.setLineDash([]);
  // goal-ish arcs
  c.strokeStyle = 'rgba(210,255,250,.2)'; c.lineWidth = 1.4;
  c.beginPath(); c.arc(W / 2, M, 70, 0, Math.PI); c.stroke();
  c.beginPath(); c.arc(W / 2, H - M, 70, Math.PI, Math.PI * 2); c.stroke();
  c.restore();

  // surface edge shading
  c.save();
  rr(c, M, M, W - 2 * M, H - 2 * M, 10);
  c.lineWidth = 2; c.strokeStyle = 'rgba(0,0,0,.45)'; c.stroke();
  c.restore();

  // pockets (on top of frame corners)
  for(const p of POCKETS){
    c.save();
    c.beginPath(); c.arc(p.x, p.y, POCKET_R + 2.5, 0, Math.PI * 2);
    c.fillStyle = '#1b2650'; c.fill();
    const g = c.createRadialGradient(p.x, p.y, 2, p.x, p.y, POCKET_R);
    g.addColorStop(0, '#000'); g.addColorStop(.75, '#02040a'); g.addColorStop(1, '#0b1020');
    c.beginPath(); c.arc(p.x, p.y, POCKET_R, 0, Math.PI * 2);
    c.fillStyle = g; c.fill();
    c.lineWidth = 1.2; c.strokeStyle = 'rgba(160,200,255,.28)'; c.stroke();
    c.restore();
  }
}

function drawDisc(d){
  if(d.state === 'out') return;
  let x = d.x, y = d.y, sc = 1, a = 1;
  if(d.state === 'sinking'){
    const e = d.t * d.t * (3 - 2 * d.t);
    x = d.sx + (d.px - d.sx) * e; y = d.sy + (d.py - d.sy) * e;
    sc = Math.max(0.02, 1 - e * 0.97); a = 1 - e * 0.35;
  }else if(d.sp < 1){
    const t = d.sp;
    sc = Math.max(0.01, 1 + 1.7 * Math.pow(t - 1, 3) + 0.7 * Math.pow(t - 1, 2));
  }
  const r = d.r * sc;
  const col = COL[d.side];
  ctx.save();
  ctx.globalAlpha = a;
  // shadow
  ctx.fillStyle = 'rgba(0,15,25,.35)';
  ctx.beginPath(); ctx.ellipse(x + 2, y + 3.5, r * 1.02, r * .95, 0, 0, Math.PI * 2); ctx.fill();
  // body
  const g = ctx.createRadialGradient(x - r * .38, y - r * .4, r * .08, x, y, r);
  g.addColorStop(0, col.light); g.addColorStop(.45, col.main); g.addColorStop(1, col.rim);
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fillStyle = g; ctx.fill();
  ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(0,0,20,.55)'; ctx.stroke();
  if(d.kind === 'k'){
    // glowing ring
    ctx.save();
    ctx.shadowColor = col.glow; ctx.shadowBlur = 12 * vs;
    ctx.lineWidth = 2.6; ctx.strokeStyle = col.glow;
    ctx.beginPath(); ctx.arc(x, y, r * .72, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
    ctx.fillStyle = 'rgba(255,255,255,.55)';
    ctx.beginPath(); ctx.arc(x, y, r * .2, 0, Math.PI * 2); ctx.fill();
    ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(255,255,255,.55)';
    ctx.beginPath(); ctx.arc(x, y, r * .97, 0, Math.PI * 2); ctx.stroke();
  }else{
    ctx.lineWidth = 1.4; ctx.strokeStyle = 'rgba(255,255,255,.4)';
    ctx.beginPath(); ctx.arc(x, y, r * .6, Math.PI * 1.1, Math.PI * 1.7); ctx.stroke();
    ctx.fillStyle = 'rgba(0,0,30,.22)';
    ctx.beginPath(); ctx.arc(x, y, r * .28, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

function drawAim(side, st, ux, uy, power){
  const col = COL[side].glow;
  const len = power * 230;
  const x0 = st.x + ux * (st.r + 5), y0 = st.y + uy * (st.r + 5);
  const x1 = st.x + ux * (st.r + 5 + len), y1 = st.y + uy * (st.r + 5 + len);
  ctx.save();
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = col; ctx.fillStyle = col;
  ctx.shadowColor = col; ctx.shadowBlur = 8 * vs;
  ctx.lineWidth = 3.4;
  ctx.setLineDash([0.1, 8]);
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
  ctx.setLineDash([]);
  // arrow head
  const ah = 12 + power * 4;
  const ang = Math.atan2(uy, ux);
  ctx.beginPath();
  ctx.moveTo(x1 + ux * ah, y1 + uy * ah);
  ctx.lineTo(x1 + Math.cos(ang + 2.5) * ah, y1 + Math.sin(ang + 2.5) * ah);
  ctx.lineTo(x1 + Math.cos(ang - 2.5) * ah, y1 + Math.sin(ang - 2.5) * ah);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawGauge(power, active, side){
  const gx = 17, gh = 26, gap = 4, n = 5;
  const totalH = n * gh + (n - 1) * gap;
  const top = H / 2 + 60;
  const filled = power > 0.02 ? Math.ceil(power * n - 0.001) : 0;
  ctx.save();
  ctx.font = '700 8px Arial, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillStyle = active ? 'rgba(235,255,255,.9)' : 'rgba(235,255,255,.4)';
  ctx.fillText('POWER', gx + 6, top - 7);
  const colors = ['#4dffb0', '#9dff5a', '#ffe94d', '#ffa63d', '#ff4d5a'];
  for(let i = 0; i < n; i++){
    const y = top + totalH - (i + 1) * gh - i * gap;
    rr(ctx, gx, y, 12, gh, 3);
    ctx.fillStyle = 'rgba(0,20,30,.55)'; ctx.fill();
    if(i < filled){
      ctx.shadowColor = colors[i]; ctx.shadowBlur = 8 * vs;
      ctx.fillStyle = colors[i]; ctx.fill();
      ctx.shadowBlur = 0;
    }
    ctx.lineWidth = 1; ctx.strokeStyle = active ? 'rgba(200,255,255,.55)' : 'rgba(200,255,255,.22)';
    rr(ctx, gx, y, 12, gh, 3); ctx.stroke();
  }
  ctx.restore();
}

function render(){
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, cv.width, cv.height);
  if(cache) ctx.drawImage(cache, 0, 0);
  ctx.setTransform(vs, 0, 0, vs, PAD * vs, PAD * vs);

  // gauge state
  let gpower = 0, gactive = false, gside = 'P';
  if(drag && state === 'aim' && turn === 'P' && striker('P')){
    gpower = dragInfo().power; gactive = true;
  }else if(aimShow){
    gpower = aimShow.power; gactive = true; gside = aimShow.side;
  }
  drawGauge(gpower, gactive, gside);

  // draw sinking discs first (under others), then alive
  for(const d of discs) if(d.state === 'sinking') drawDisc(d);
  for(const d of discs) if(d.state === 'alive' && d.kind === 's') drawDisc(d);
  for(const d of discs) if(d.state === 'alive' && d.kind === 'k') drawDisc(d);

  // player striker hint pulse
  if(state === 'aim' && turn === 'P' && !drag && !paused){
    const st = striker('P');
    if(st && st.state === 'alive'){
      const pr = st.r + 7 + Math.sin(clock * 4.5) * 2.5;
      ctx.save();
      ctx.strokeStyle = 'rgba(0,229,255,' + (0.35 + 0.25 * Math.sin(clock * 4.5)) + ')';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(st.x, st.y, pr, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }
  }

  // drag + aim
  if(drag && state === 'aim' && turn === 'P'){
    const st = striker('P');
    if(st){
      const info = dragInfo();
      if(info.len > 4){
        const l = Math.min(info.len, MAXDRAG);
        const bx = st.x + (info.dx / info.len) * l, by = st.y + (info.dy / info.len) * l;
        ctx.save();
        ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 2; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(st.x, st.y); ctx.lineTo(bx, by); ctx.stroke();
        ctx.fillStyle = 'rgba(255,255,255,.5)';
        ctx.beginPath(); ctx.arc(bx, by, 5, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }
      if(info.power > 0.02) drawAim('P', st, info.ux, info.uy, info.power);
    }
  }else if(aimShow){
    const st = striker(aimShow.side);
    if(st) drawAim(aimShow.side, st, aimShow.ux, aimShow.uy, aimShow.power);
  }
}

/* ================= Layout ================= */
function fit(){
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const aw = app.clientWidth - 16;
  const others = app.offsetHeight - wrap.offsetHeight;
  const availH = window.innerHeight - others - 6;
  let w = Math.min(aw, availH * (CW / CH));
  w = Math.max(w, 230);
  wrap.style.width = Math.floor(w) + 'px';
  const cssW = Math.floor(w);
  const cssH = Math.round(cssW * CH / CW);
  cv.width = Math.round(cssW * dpr);
  cv.height = Math.round(cssH * dpr);
  cv.style.height = cssH + 'px';
  vs = cv.width / CW;
  buildCache();
}
window.addEventListener('resize', fit);
window.addEventListener('orientationchange', () => setTimeout(fit, 150));

/* ================= Main loop ================= */
let last = performance.now();
function frame(ts){
  const dt = Math.min(0.033, Math.max(0, (ts - last) / 1000));
  last = ts;
  clock += dt;
  update(dt);
  updateTimerUI();
  render();
  requestAnimationFrame(frame);
}

/* ================= Init ================= */
